{% extends "base.html" %}

{% block title %}Xem PDF: {{ material.title }}{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="{{ url_for('main.lesson_detail', lesson_id=material.lesson_id) }}" class="text-sm font-semibold text-slate-600 hover:text-[#0B4FD8] inline-flex items-center gap-1.5">
    ← Quay lại bài học
  </a>
</div>

<section class="page-header-bar">
  <div>
    <h1>{{ material.title }}</h1>
    <p>Tài liệu PDF • {{ meta.page_count }} trang • {{ material.file_size | filesize }}</p>
  </div>
  <div class="flex items-center gap-2.5">
    <span class="clay-badge badge-pdf">PDF</span>
    <a href="{{ url_for('main.download_material', material_id=material.id) }}" class="clay-btn clay-btn-secondary clay-btn-sm">
      Tải về máy
    </a>
  </div>
</section>

<div class="clay-card p-2 h-[80vh] overflow-hidden">
  <iframe
    src="{{ url_for('main.serve_raw_material', material_id=material.id) }}"
    class="w-full h-full border-0 rounded-lg"
    title="{{ material.title }}"
  ></iframe>
</div>
{% endblock %}
