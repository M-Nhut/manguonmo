<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="600" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#091536"/>
      <stop offset="55%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" rx="20" fill="url(#bg1)"/>
  <!-- Grid floor -->
  <path d="M0 250 H600 M0 285 H600 M120 220 L40 320 M240 220 L200 320 M360 220 L400 320 M480 220 L560 320" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- Cyber Knight -->
  <g transform="translate(75, 78)">
    <circle cx="72" cy="95" r="64" fill="#38BDF8" fill-opacity="0.15"/>
    <polygon points="48,68 96,68 106,142 38,142" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
    <polygon points="52,26 92,26 98,62 46,62" fill="#1E293B" stroke="#60A5FA" stroke-width="2.5"/>
    <rect x="58" y="38" width="32" height="12" rx="4" fill="#38BDF8"/>
    <!-- Giant Sword Slash -->
    <polygon points="95,78 255,6 268,24 108,102" fill="url(#blade)"/>
  </g>
  <!-- Lightning Clash -->
  <circle cx="315" cy="112" r="22" fill="#FACC15" fill-opacity="0.9"/>
  <circle cx="315" cy="112" r="42" fill="#F59E0B" fill-opacity="0.3"/>
  <!-- Boss Monster with HP Bar -->
  <g transform="translate(365, 52)">
    <!-- HP Bar -->
    <rect x="20" y="0" width="130" height="12" rx="6" fill="#0F172A" stroke="#FDA4AF" stroke-width="1.5"/>
    <rect x="22" y="2" width="96" height="8" rx="4" fill="#F43F5E"/>
    <!-- Boss Body -->
    <polygon points="45,42 72,16 82,52" fill="#E11D48"/>
    <polygon points="125,42 98,16 88,52" fill="#E11D48"/>
    <polygon points="35,48 135,48 162,88 162,148 135,182 35,182 8,148 8,88" fill="#31102F" stroke="#F43F5E" stroke-width="3.5"/>
    <polygon points="42,84 78,96 48,108" fill="#FACC15"/>
    <polygon points="128,84 92,96 122,108" fill="#FACC15"/>
    <rect x="48" y="132" width="74" height="22" rx="6" fill="#F43F5E"/>
  </g>
</svg>
