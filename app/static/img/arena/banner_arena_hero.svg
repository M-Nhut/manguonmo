<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050B1E"/>
      <stop offset="45%" stop-color="#0E1F52"/>
      <stop offset="100%" stop-color="#27145E"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.25" cy="0.45" r="0.45">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCrimson" cx="0.78" cy="0.42" r="0.42">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="280" y1="210" x2="860" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="sword" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glowCyan)"/>
  <rect width="1200" height="420" fill="url(#glowCrimson)"/>

  <!-- Cyber Perspective Floor Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1.5">
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="340" x2="1200" y2="340"/>
    <line x1="0" y1="375" x2="1200" y2="375"/>
    <line x1="0" y1="412" x2="1200" y2="412"/>
    <line x1="600" y1="270" x2="100" y2="420"/>
    <line x1="600" y1="270" x2="320" y2="420"/>
    <line x1="600" y1="270" x2="500" y2="420"/>
    <line x1="600" y1="270" x2="700" y2="420"/>
    <line x1="600" y1="270" x2="880" y2="420"/>
    <line x1="600" y1="270" x2="1100" y2="420"/>
  </g>

  <!-- Starfield -->
  <g fill="#E0F2FE" opacity="0.7">
    <circle cx="90" cy="60" r="2"/><circle cx="210" cy="44" r="1.5"/><circle cx="420" cy="70" r="2.2"/>
    <circle cx="580" cy="38" r="1.8"/><circle cx="740" cy="62" r="2"/><circle cx="1050" cy="50" r="2.5"/>
    <circle cx="1130" cy="110" r="1.5"/><circle cx="640" cy="120" r="1.5"/>
  </g>

  <!-- Left: Cyber Knight Hero with Giant Plasma Blade -->
  <g transform="translate(175, 115)">
    <!-- Energy Aura -->
    <circle cx="95" cy="125" r="88" fill="#0EA5E9" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="10 6"/>
    <!-- Cape -->
    <path d="M55 95 L10 215 L75 195 Z" fill="#1D4ED8" opacity="0.9"/>
    <!-- Body Armor -->
    <polygon points="75,85 125,85 135,165 65,165" fill="#1E293B" stroke="#38BDF8" stroke-width="3"/>
    <polygon points="85,100 115,100 108,145 92,145" fill="#0EA5E9"/>
    <!-- Helmet & Visor -->
    <polygon points="78,38 122,38 130,78 70,78" fill="#0F172A" stroke="#60A5FA" stroke-width="3"/>
    <polygon points="82,54 124,50 120,66 84,66" fill="#38BDF8"/>
    <!-- Plasma Sword Slash -->
    <polygon points="128,95 320,15 335,34 142,122" fill="url(#sword)"/>
    <polygon points="120,92 146,126 115,134 106,104" fill="#FACC15"/>
  </g>

  <!-- Top Center: Neon Starfighter Spaceship -->
  <g transform="translate(490, 58)">
    <polygon points="0,35 75,20 95,35 75,50" fill="#38BDF8" stroke="#E0F2FE" stroke-width="2"/>
    <polygon points="20,12 58,28 20,28" fill="#6366F1"/>
    <polygon points="20,58 58,42 20,42" fill="#6366F1"/>
    <circle cx="62" cy="35" r="6" fill="#FEF08A"/>
    <!-- Twin Laser Beams -->
    <line x1="98" y1="28" x2="255" y2="55" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
    <line x1="98" y1="42" x2="255" y2="70" stroke="#FACC15" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Clash Energy Beam -->
  <path d="M475 145 Q605 180 740 165" stroke="url(#beam)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <circle cx="610" cy="166" r="24" fill="#FEF08A" fill-opacity="0.85"/>
  <circle cx="610" cy="166" r="44" fill="#F59E0B" fill-opacity="0.28"/>

  <!-- Right: Giant Mecha-Virus Boss Monster -->
  <g transform="translate(770, 75)">
    <circle cx="145" cy="125" r="105" fill="#F43F5E" fill-opacity="0.14" stroke="#FB7185" stroke-opacity="0.45" stroke-width="2.5" stroke-dasharray="12 8"/>
    <!-- Boss Horns / Spikes -->
    <polygon points="65,45 105,10 115,65" fill="#BE123C" stroke="#FDA4AF" stroke-width="2"/>
    <polygon points="225,45 185,10 175,65" fill="#BE123C" stroke="#FDA4AF" stroke-width="2"/>
    <polygon points="35,120 5,95 55,155" fill="#9F1239"/>
    <polygon points="255,120 285,95 235,155" fill="#9F1239"/>
    <!-- Boss Core Octagon -->
    <polygon points="95,50 195,50 235,100 235,165 195,210 95,210 55,165 55,100" fill="#1E1B4B" stroke="#F43F5E" stroke-width="4"/>
    <!-- Glowing Angry Eyes -->
    <polygon points="88,98 134,114 95,125" fill="#FACC15"/>
    <polygon points="202,98 156,114 195,125" fill="#FACC15"/>
    <!-- Boss Energy Mouth / Core -->
    <polygon points="100,152 190,152 175,184 115,184" fill="#F43F5E"/>
    <line x1="122" y1="152" x2="122" y2="184" stroke="#1E1B4B" stroke-width="4"/>
    <line x1="145" y1="152" x2="145" y2="184" stroke="#1E1B4B" stroke-width="4"/>
    <line x1="168" y1="152" x2="168" y2="184" stroke="#1E1B4B" stroke-width="4"/>
  </g>
</svg>
