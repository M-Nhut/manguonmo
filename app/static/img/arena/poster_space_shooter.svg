<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="600" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040B24"/>
      <stop offset="50%" stop-color="#0F296B"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" rx="20" fill="url(#bg2)"/>
  <!-- Stars -->
  <g fill="#E0F2FE" opacity="0.75">
    <circle cx="60" cy="45" r="2"/><circle cx="150" cy="90" r="1.5"/><circle cx="520" cy="60" r="2.2"/>
    <circle cx="460" cy="180" r="1.8"/><circle cx="95" cy="220" r="2"/>
  </g>
  <!-- 4 Alien Answer Monsters (A, B, C, D) -->
  <g transform="translate(55, 36)">
    <!-- Monster A -->
    <g transform="translate(0, 12)">
      <polygon points="20,10 85,10 100,35 85,65 20,65 5,35" fill="#1E293B" stroke="#60A5FA" stroke-width="2.5"/>
      <text x="52" y="45" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-weight="800" font-size="22">A</text>
    </g>
    <!-- Monster B (Target Hit!) -->
    <g transform="translate(132, 0)">
      <circle cx="52" cy="38" r="44" fill="#10B981" fill-opacity="0.24"/>
      <polygon points="20,10 85,10 100,35 85,65 20,65 5,35" fill="#064E3B" stroke="#34D399" stroke-width="3"/>
      <text x="52" y="45" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-weight="800" font-size="22">B</text>
    </g>
    <!-- Monster C -->
    <g transform="translate(264, 12)">
      <polygon points="20,10 85,10 100,35 85,65 20,65 5,35" fill="#1E293B" stroke="#A78BFA" stroke-width="2.5"/>
      <text x="52" y="45" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-weight="800" font-size="22">C</text>
    </g>
    <!-- Monster D -->
    <g transform="translate(390, 18)">
      <polygon points="20,10 85,10 100,35 85,65 20,65 5,35" fill="#1E293B" stroke="#FBBF24" stroke-width="2.5"/>
      <text x="52" y="45" text-anchor="middle" fill="#FDE68A" font-family="monospace" font-weight="800" font-size="22">D</text>
    </g>
  </g>
  <!-- Twin Laser Beams hitting Monster B -->
  <line x1="230" y1="220" x2="230" y2="95" stroke="#34D399" stroke-width="4" stroke-dasharray="10 6"/>
  <line x1="250" y1="220" x2="250" y2="95" stroke="#FACC15" stroke-width="4" stroke-dasharray="10 6"/>
  <circle cx="240" cy="85" r="18" fill="#FEF08A"/>
  <!-- Player Starfighter at bottom -->
  <g transform="translate(190, 212)">
    <polygon points="50,0 92,68 65,56 50,74 35,56 8,68" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="2.5"/>
    <polygon points="50,18 62,48 38,48" fill="#FEF08A"/>
  </g>
</svg>
